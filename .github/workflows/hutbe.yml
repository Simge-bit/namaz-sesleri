name: Cuma hutbesini al

on:
  schedule:
    # Perşembe ve cuma 06:00 (UTC). Diyanet hutbeyi genelde perşembe yayımlar.
    - cron: '0 6 * * 4,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hutbe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q libreoffice-writer-nogui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python betik/hutbe.py
      - name: Değişiklikleri gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hutbe
          git diff --cached --quiet || git commit -m "Cuma hutbelerini güncelle"
          git push
