name: Vakitleri güncelle

on:
  schedule:
    # Her pazartesi 03:00 (UTC)
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python betik/guncelle.py
      - name: Değişiklikleri gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vakit
          git diff --cached --quiet || git commit -m "Vakit çizelgelerini güncelle"
          git push
